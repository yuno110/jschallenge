<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Js Challenge</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="leftbox">
        <p class="clock">00:00:00</p>
        <div class="weather">
            <span></span>
            <span></span>
        </div>
        <div class="quotes">
            <span></span></br>
            <span></span>
        </div>
        <button id="lfbtn">Change Quotes</button>
    </div>
    <div class="rightbox">
        <div class="lgbox">
            <form class="login-form hidden">
                <input type="text" maxlength="15" placeholder="What Is Your Name?" required />
                <button>Log In</button>
            </form>
            <p class="greetings hidden"></p>
        </div>
        <div class="todobox">
            <form class="todo-form">
                <input type="text" maxlength="15" placeholder="Write a To Do and Press Enter" required />
            </form>
            <ul class="todo-list"></ul>
        </div>
        <button id="rtbtn">Change BackgroundColor</button>
    </div>


    <script src="js/greetings.js"></script>
    <script src="js/todos.js"></script>
    <script src="js/background.js"></script>
    <script src="js/clock.js"></script>
    <script src="js/quotes.js"></script>
    <script src="js/weather.js"></script>

</body>

</html>
